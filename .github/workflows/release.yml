# Publishes the Oip.Settings NuGet package for a published GitHub Release.

name: Release

on:
  release:
    types: [ "published" ]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the version from the release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        # The tag is the only source of the released version, nothing in the tree is compared against it.
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Release tag $TAG is not a SemVer version, expected something like v1.2.3."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore ./src/Oip.Settings.sln -p:Version=${{ steps.version.outputs.version }}
      - name: Build
        # The global Version property overrides <Version> from Oip.Settings.csproj, the tree keeps its own value.
        run: dotnet build ./src/Oip.Settings.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}
      - name: Test
        run: dotnet test ./src/Oip.Settings.sln --configuration Release --no-build --filter "TestCategory!=Integration"
      - name: Publish nuget
        run: dotnet nuget push ./src/Oip.Settings/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_PUSH_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
